# Deploy do Entrelinhas no Render (plano gratuito): um serviço web que roda
# o Bifrost privado e o Entrelinhas em modo público, com cota diária.
services:
  - type: web
    name: entrelinhas
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: bash deploy/iniciar.sh
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ENTRELINHAS_PUBLICO
        value: "1"
      - key: ENTRELINHAS_LIMITE_IP_DIA
        value: "5"
      - key: ENTRELINHAS_LIMITE_DIA
        value: "25"
      # Mesmo modelo (gpt-oss-20b) em dois provedores: OpenRouter primeiro,
      # Groq como reserva. O Bifrost troca sozinho se um deles falhar.
      - key: BIFROST_MODEL
        value: openrouter/openai/gpt-oss-20b
      - key: BIFROST_FALLBACKS
        value: groq/openai/gpt-oss-20b,groq/openai/gpt-oss-120b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
